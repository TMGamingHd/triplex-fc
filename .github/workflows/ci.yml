name: ci
# GitHub Flow: every change arrives as a PR, so run on PRs and on main.
# (Running on every branch push as well would duplicate the PR run.)
#
# Minutes: the account is on the Free plan (2,000 Actions minutes a month for a private repository). A full run was about 16
# billed minutes, 9 of them the fault campaign. So:
#  - a push to a pull request cancels the run it supersedes;
#  - a change that touches only documentation runs just the documentation check (about a minute), not the build;
#  - a pull request runs a spread-out sample of the campaign (every 8th scenario of each group, about a minute);
#    the FULL campaign runs on main (every merge) and on demand (Actions > ci > Run workflow);
#  - every job has a timeout, so a hung run cannot burn the month.
# Mutation testing is a separate weekly workflow (mutation.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    # Decides whether the heavy jobs are needed, and always runs the documentation check (it reads sim/README.md against the tools).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Documentation check (every flag, fault kind and counter is documented)
        run: cd sim && python3 -m unittest tests.test_docs tests.test_docs_consistency
      - name: Did anything besides documentation change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A manual run, a new branch or a rewritten history has no usable base: treat it as a code change.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no usable base: running everything"
            exit 0
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "changed files:"; echo "$files"
          if echo "$files" | grep -qvE '^(docs/|README\.md$|firmware/README\.md$|tools/bench/README\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "documentation only: the build and the campaign are skipped"
          fi

  sil:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy cppcheck
      - name: Configure (sanitizers on)
        run: cmake -S . -B build -G Ninja -DTFC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test (host unit tests + virtual-peers end-to-end)
        run: ctest --test-dir build --output-on-failure
      - name: clang-tidy (flight code; bug patterns, CERT, size and complexity limits)
        run: clang-tidy -p build tests/*.cpp tools/replay/*.cpp
      - name: cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,portability --inline-suppr --language=c++ --std=c++17 -I core/include -I supervisor/include core/include/tfc/*.hpp supervisor/include/sup/*.hpp
      - name: Coding standard (mechanical rules of docs/verification/CODING_STANDARD.md)
        run: python3 tools/check_standard.py
      - name: Structural coverage of core/ and of the vehicle simulator (gates may only be raised)
        run: python3 tools/coverage/core_coverage.py --min-line 100 --min-branch 98 --sim-min-line 99 --sim-min-branch 93
      - name: Fault campaign (safety properties on every frame; fails on any anomaly; a sample on pull requests, everything on main)
        run: |
          cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/rel --target tfc_replay
          cd sim
          if [ "${{ github.event_name }}" = "pull_request" ]; then sample="--every 8"; else sample=""; fi
          echo "campaign sample option: '${sample}'"
          TFC_REPLAY_BIN="$GITHUB_WORKSPACE/build/rel/tfc_replay" python3 -m campaign.run --workers 4 --quiet --strict $sample --out "$RUNNER_TEMP/campaign.jsonl"
      - name: Campaign tables (for the job summary)
        if: always()
        run: |
          cd sim
          python3 -m campaign.report "$RUNNER_TEMP/campaign.jsonl" >> "$GITHUB_STEP_SUMMARY" || true

  firmware:
    # Builds the Zephyr app for the host (native_sim, runs it) and for the real board.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZEPHYR_SDK_VERSION: "1.0.1"
    steps:
      - uses: actions/checkout@v6
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build device-tree-compiler gperf ccache
      - name: Install west and Zephyr Python requirements
        run: |
          python3 -m venv ../.venv
          ../.venv/bin/pip install -q west
          ../.venv/bin/west init -l firmware
          ../.venv/bin/west update --narrow -o=--depth=1
          ../.venv/bin/pip install -q -r zephyr/scripts/requirements-base.txt
      - name: Install Zephyr SDK (minimal + ARM toolchain)
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${ZEPHYR_SDK_VERSION}/zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${ZEPHYR_SDK_VERSION}_linux-x86_64_minimal.tar.xz -C "$HOME"
          "$HOME/zephyr-sdk-${ZEPHYR_SDK_VERSION}/setup.sh" -t arm-zephyr-eabi -h -c
      - name: Build FC-A (for the Python peers), the three flight computers of the triplex and ACT for native_sim
        run: |
          . firmware/env.sh
          west build -p always -b native_sim/native/64 firmware/app -d build/native_sim
          # the software triplex: three flight computers (node ids 0, 1, 2) on the scripted command, so that the takeover test does not depend on the inputs
          letters=(a b c)
          for n in 0 1 2; do
            west build -p always -b native_sim/native/64 firmware/app -d "build/triplex_${letters[$n]}" -- -DCONFIG_TFC_NODE_ID=$n
          done
          west build -p always -b native_sim/native/64 firmware/act -d build/act_native
      - name: Live FC-A against virtual peers (needs vcan; tests skip if the runner has none)
        run: |
          # The runner's Azure kernel ships vcan in linux-modules-extra.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || echo "modules-extra not installable"
          sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0 \
            || echo "vcan unavailable on this runner: live tests will be skipped"
          cd sim
          TFC_FC_BIN="$GITHUB_WORKSPACE/build/native_sim/zephyr/zephyr.exe" python3 -m unittest tests.test_live_fc -v
      - name: Live software triplex (firmware instances on one vcan0; A is killed and B takes over SYNC; ACT votes, excludes dead computers, and safes with none)
        run: |
          cd sim
          python3 -m unittest tests.test_live_triplex -v
      - name: Build for nucleo_g474re
        run: |
          . firmware/env.sh
          west build -p always -b nucleo_g474re firmware/app -d build/nucleo_g474re
          west build -p always -b nucleo_g474re firmware/act -d build/act_nucleo
          west build -p always -b rpi_pico2/rp2350a/m33 firmware/pico -d build/pico
          west build -p always -b rpi_pico2/rp2350a/m33 firmware/supervisor -d build/supervisor
      - name: No heap, exceptions, RTTI or vtables in the flight binary
        run: |
          tools/check_elf.sh build/nucleo_g474re/zephyr/zephyr.elf
          tools/check_elf.sh build/act_nucleo/zephyr/zephyr.elf
          tools/check_elf.sh build/pico/zephyr/zephyr.elf
          tools/check_elf.sh build/supervisor/zephyr/zephyr.elf
