name: mutation
# Verifies: TFC-SW-011 (every deliberate bug in tools/mutation/mutations.py is caught by the C++ tests, and by the campaign unless it is a configuration or equivalent mutant)
# Mutation testing is the check on the checks: deliberate bugs are injected into a copy of core/ and every one must be caught.
# It takes a while (the unit suite rebuilds for each mutant, the campaign reruns for each), so it runs weekly and on demand,
# not on every pull request. See docs/verification/CODING_STANDARD.md section 3.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Every mutant must be killed by the C++ tests
        run: python3 tools/mutation/run_unit.py --jobs 4
  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Every deliberate bug in the vehicle simulator must be killed by the C++ tests
        run: python3 tools/mutation/run_sim.py --jobs 4
  campaign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Every (non self-protection) mutant must be caught by the fault campaign
        run: |
          cd sim
          python3 -m campaign.mutate
