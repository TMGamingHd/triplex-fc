name: ci
on: [push, pull_request]
jobs:
  sil:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy cppcheck
      - name: Configure (sanitizers on)
        run: cmake -S . -B build -G Ninja -DTFC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: clang-tidy (flight code)
        run: clang-tidy -p build tests/*.cpp
      - name: cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,portability --inline-suppr -I core/include core/include
