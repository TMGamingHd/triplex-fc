<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFC Flight Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f131b'/%3E%3Cpath d='M16 4l4 9v8l-4 5-4-5v-8z' fill='none' stroke='%234cc9f0' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--panel2)"/><path d="M16 4l4 9v8l-4 5-4-5v-8z" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="14" r="1.8" fill="var(--accent)"/></svg>
      <span>TFC <small>flight console</small></span>
    </div>
    <span id="src-chip" class="chip muted"><i class="dot"></i><span>no source</span></span>
    <div id="clock" aria-live="off"><span id="clock-v">--:--.-</span><small id="clock-l">no sync</small></div>
    <span id="mode-chip" class="chip muted">—</span>
    <span id="act-chip" class="chip muted">ACT —</span>
    <span class="spacer"></span>
    <button id="alert-chip" class="chip muted" title="Open the alerts" type="button">no alerts</button>
    <button id="rec-btn" class="iconbtn rec" title="Record the bus and the consoles to logs/" type="button"><svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg><span>REC</span></button>
    <button id="theme-btn" class="iconbtn" title="Dark or light" type="button" aria-label="Switch theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
  </header>
  <nav id="nav" role="tablist" aria-label="Console tabs"></nav>
  <main id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<noscript>This console is a web application and needs JavaScript.</noscript>
<script src="js/boot.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
