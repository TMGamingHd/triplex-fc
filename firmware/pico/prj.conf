CONFIG_CPP=y
CONFIG_STD_CPP17=y
# Flight-code rules (ARCHITECTURE.md section 6): no exceptions, no RTTI, no heap.
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_COMMON_LIBC_MALLOC=n

# The USB serial link to the PC (the new USB device stack)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Servo pulses, relay lines, the watchdog and the reset cause
CONFIG_PWM=y
CONFIG_GPIO=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_MAIN_STACK_SIZE=4096
