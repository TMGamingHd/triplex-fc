# Run in wall-clock time so the host's SocketCAN peers see a real 100 Hz schedule.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# The host CAN driver polls the socket every 1 ms (zephyr/drivers/can/can_native_linux.c), so a peer's frames reach us up to 1 ms late and a follower
# locks to SYNC up to 1 ms late: the vote moves from 7 ms to 8 ms, or about one command in eleven would miss it.
CONFIG_TFC_VOTE_US=8000

# ... and the takeover SYNC of B can reach C up to 1 ms after it was sent, so the stagger of the SYNC windows must exceed that (ADR-025).
CONFIG_TFC_SYNC_STAGGER_US=2500
