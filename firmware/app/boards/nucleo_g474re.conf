# Receive timestamps on the FDCAN peripheral: the arrival time of every frame, for the margin telemetry of TFC-FDIR-037.
CONFIG_CAN_RX_TIMESTAMP=y

# A stack that overflows is caught by the MPU as a fatal fault (the node's handler records it, and the watchdog resets the board) instead of overwriting what lies below it (docs/design/FUTURE_WORK.md 6b item 12).
CONFIG_HW_STACK_PROTECTION=y
