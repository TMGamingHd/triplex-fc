CONFIG_CPP=y
CONFIG_STD_CPP17=y
# Flight-code rules (ARCHITECTURE.md section 6): no exceptions, no RTTI.
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# core/ uses <array> and <cmath>, so link the toolchain's full libstdc++ (header-only use, no heap).
CONFIG_REQUIRES_FULL_LIBCPP=y

# Flight bus
CONFIG_CAN=y

# The frame schedule has 0.5 ms slots (ARCHITECTURE.md section 3): 100 us kernel ticks, not the default 10 ms.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# No dynamic memory (JPL Power of Ten rule 3, docs/CODING_STANDARD.md). With the C library's malloc removed, any
# accidental use of the heap becomes a link error instead of a field failure.
CONFIG_COMMON_LIBC_MALLOC=n
