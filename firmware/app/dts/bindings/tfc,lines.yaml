# SPDX-License-Identifier: MIT
description: |
  The discrete lines between a node and the supervisor (docs/SUPERVISOR.md), and the node-id strap pins.
  FRAME: a pulse at the start of every frame. KICK: a pulse at the end of a completed frame, driven only from the
  end-of-frame path (TFC-FDIR-038). ADOPT: an input from the supervisor (the ring re-homing stretch, ADR-020). T0: an input from the supervisor, high from its T-zero on (ADR-028).

compatible: "tfc,lines"

properties:
  frame-gpios:
    type: phandle-array
    required: true
  kick-gpios:
    type: phandle-array
    required: true
  adopt-gpios:
    type: phandle-array
  t0-gpios:
    type: phandle-array
    description: An input from the supervisor, high from its T-zero on (ADR-028). Optional; without it the countdown runs out on its own.
  id-gpios:
    type: phandle-array
    required: true
    description: Two straps, bit 0 then bit 1; a strap tied to ground reads as 1 (active low).
