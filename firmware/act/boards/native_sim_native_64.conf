# Run in wall-clock time so the host's SocketCAN peers see a real 100 Hz schedule.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
# The host CAN driver polls the socket every 1 ms (zephyr/drivers/can/can_native_linux.c): a flight computer's command reaches ACT up to 2 ms after it was
# sent, and ACT locks to SYNC up to 1 ms late. ACT votes at 7.5 ms, just before the flight computers' own 8 ms vote on the host.
CONFIG_TFC_ACT_VOTE_US=7500

# ... and the takeover SYNC of B can reach C up to 1 ms after it was sent, so the stagger of the SYNC windows must exceed that (ADR-025).
CONFIG_TFC_SYNC_STAGGER_US=1500
